services:
  - type: web
    name: autodeskai-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: OLLAMA_HOST
        sync: false
      - key: OLLAMA_MODEL
        value: qwen3:8b
      - key: OLLAMA_TIMEOUT
        value: "90"
      - key: TASK_TIMEOUT_SECONDS
        value: "600"
      - key: DEVICE_OFFLINE_SECONDS
        value: "120"
