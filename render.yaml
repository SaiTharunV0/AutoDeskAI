services:
  - type: web
    name: autodeskai-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ADMIN_REGISTRATION_CODE
        sync: false
      - key: OLLAMA_HOST
        value: https://ollama.com
      - key: OLLAMA_MODEL
        value: gemma4:31b
      - key: OLLAMA_API_KEY
        sync: false
      - key: OLLAMA_TIMEOUT
        value: "90"
      - key: TASK_TIMEOUT_SECONDS
        value: "600"
      - key: DEVICE_OFFLINE_SECONDS
        value: "120"
