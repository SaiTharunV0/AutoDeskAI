services:
  - type: web
    name: autodeskai-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ADMIN_REGISTRATION_CODE
        sync: false
      - key: OLLAMA_HOST
        value: https://ollama.com
      - key: OLLAMA_MODEL
        value: gemma4:31b
      - key: OLLAMA_API_KEY
        sync: false
      - key: OLLAMA_TIMEOUT
        value: "90"
      - key: CHAT_RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: CHAT_RATE_LIMIT_PER_HOUR
        value: "60"
      - key: CHAT_OUT_OF_SCOPE_LIMIT_PER_MINUTE
        value: "5"
      - key: CHAT_MAX_MESSAGE_LENGTH
        value: "2000"
      - key: TASK_TIMEOUT_SECONDS
        value: "600"
      - key: DEVICE_OFFLINE_SECONDS
        value: "120"
      - key: MICROSOFT_SSPR_URL
        value: https://passwordreset.microsoftonline.com/
