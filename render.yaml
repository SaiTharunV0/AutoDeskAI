services:
  - type: web
    name: autodeskai-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ADMIN_REGISTRATION_CODE
        sync: false
      - key: OLLAMA_HOST
        value: https://ollama.com
      - key: OLLAMA_MODEL
        value: gemma4:31b
      - key: OLLAMA_API_KEY
        sync: false
      - key: GITHUB_ORG
        value: AutoDeskAI
      - key: GITHUB_TOKEN
        sync: false
      - key: JIRA_SITE_URL
        value: https://autodeskai.atlassian.net
      - key: JIRA_ADMIN_EMAIL
        sync: false
      - key: JIRA_API_TOKEN
        sync: false
      - key: JIRA_PRODUCT_KEY
        sync: false
      - key: JIRA_ROLE_MAP
        value: '{"user":"fd11d17e-a700-4ef9-8432-3714dfeace93"}'
      - key: OLLAMA_TIMEOUT
        value: "90"
      - key: CHAT_RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: CHAT_RATE_LIMIT_PER_HOUR
        value: "60"
      - key: CHAT_OUT_OF_SCOPE_LIMIT_PER_MINUTE
        value: "5"
      - key: CHAT_MAX_MESSAGE_LENGTH
        value: "2000"
      - key: TASK_TIMEOUT_SECONDS
        value: "1800"
      - key: DEVICE_OFFLINE_SECONDS
        value: "120"
      - key: MICROSOFT_SSPR_URL
        value: https://passwordreset.microsoftonline.com/
  - type: cron
    name: autodeskai-github-expiry
    runtime: python
    schedule: '0 2 * * *'
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.github_expiry
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GITHUB_ORG
        value: AutoDeskAI
      - key: GITHUB_TOKEN
        sync: false
