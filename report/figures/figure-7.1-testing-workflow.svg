<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="figure-7.1-testing-workflow.svg"><rect x="0" y="0" width="1600" height="900" rx="0" fill="#f5faf7" stroke="#f5faf7" stroke-width="2"/><rect x="0" y="0" width="1600" height="15" rx="0" fill="#0d7160" stroke="#0d7160" stroke-width="2"/><text x="60" y="82" fill="#0d7160" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" text-anchor="start">FIGURE 7.1</text><text x="60" y="132" fill="#15352e" font-family="Arial,Helvetica,sans-serif" font-size="39" font-weight="700" text-anchor="start">Backend and Frontend Testing Workflow</text><text x="60" y="170" fill="#557068" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" text-anchor="start">Local checks validate policy logic, API behavior, and the built client.</text><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#0d7160" stroke-width="2"/></marker></defs><rect x="70" y="335" width="260" height="165" rx="18" fill="white" stroke="#92b7a6" stroke-width="2"/><text x="92" y="373" fill="#15352e" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="start">Code change</text><text x="92" y="412" fill="#15352e" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" text-anchor="start">Backend or frontend</text><rect x="410" y="235" width="315" height="160" rx="18" fill="white" stroke="#92b7a6" stroke-width="2"/><text x="432" y="273" fill="#15352e" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="start">Backend tests</text><text x="432" y="312" fill="#15352e" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" text-anchor="start">pytest: auth, policy,</text><text x="432" y="341" fill="#15352e" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" text-anchor="start">provider + requests</text><rect x="410" y="475" width="315" height="160" rx="18" fill="white" stroke="#92b7a6" stroke-width="2"/><text x="432" y="513" fill="#15352e" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="start">Frontend tests</text><text x="432" y="552" fill="#15352e" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" text-anchor="start">Vitest: flow, UI,</text><text x="432" y="581" fill="#15352e" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" text-anchor="start">pagination + API</text><rect x="805" y="335" width="315" height="165" rx="18" fill="white" stroke="#92b7a6" stroke-width="2"/><text x="827" y="373" fill="#15352e" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="start">Frontend build</text><text x="827" y="412" fill="#15352e" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" text-anchor="start">Vite production build</text><rect x="1200" y="335" width="300" height="165" rx="18" fill="white" stroke="#92b7a6" stroke-width="2"/><text x="1222" y="373" fill="#15352e" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="start">Review + deploy</text><text x="1222" y="412" fill="#15352e" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" text-anchor="start">Diff, commit, push</text><path d="M335 390 L395 315" fill="none" stroke="#0d7160" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><path d="M335 445 L395 550" fill="none" stroke="#0d7160" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><path d="M730 310 L790 395" fill="none" stroke="#0d7160" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><path d="M730 550 L790 445" fill="none" stroke="#0d7160" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><path d="M1125 420 H1185" fill="none" stroke="#0d7160" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><text x="60" y="850" fill="#557068" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="start">Tests use local and mocked services; live tenant verification is a separate check.</text></svg>
