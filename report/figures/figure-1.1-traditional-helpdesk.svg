<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="figure-1.1-traditional-helpdesk.svg"><rect x="0" y="0" width="1600" height="900" rx="0" fill="#f5faf7" stroke="#f5faf7" stroke-width="2"/><rect x="0" y="0" width="1600" height="15" rx="0" fill="#0d7160" stroke="#0d7160" stroke-width="2"/><text x="60" y="82" fill="#0d7160" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" text-anchor="start">FIGURE 1.1</text><text x="60" y="132" fill="#15352e" font-family="Arial,Helvetica,sans-serif" font-size="39" font-weight="700" text-anchor="start">Traditional IT Help Desk Problem Domain</text><text x="60" y="170" fill="#557068" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" text-anchor="start">Manual triage and disconnected follow-up create delay and limited visibility.</text><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#0d7160" stroke-width="2"/></marker></defs><rect x="70" y="285" width="290" height="175" rx="18" fill="white" stroke="#92b7a6" stroke-width="2"/><text x="92" y="323" fill="#15352e" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="start">Employee</text><text x="92" y="362" fill="#15352e" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" text-anchor="start">Password, software,</text><text x="92" y="391" fill="#15352e" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" text-anchor="start">or access issue</text><rect x="500" y="285" width="290" height="175" rx="18" fill="white" stroke="#92b7a6" stroke-width="2"/><text x="522" y="323" fill="#15352e" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="start">Support inbox</text><text x="522" y="362" fill="#15352e" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" text-anchor="start">Email or phone queue</text><text x="522" y="391" fill="#15352e" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" text-anchor="start">and repeated details</text><rect x="930" y="225" width="290" height="175" rx="18" fill="white" stroke="#92b7a6" stroke-width="2"/><text x="952" y="263" fill="#15352e" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="start">IT administrator</text><text x="952" y="302" fill="#15352e" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" text-anchor="start">Manual review</text><text x="952" y="331" fill="#15352e" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" text-anchor="start">and handoff</text><rect x="930" y="480" width="290" height="175" rx="18" fill="white" stroke="#92b7a6" stroke-width="2"/><text x="952" y="518" fill="#15352e" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="start">Separate systems</text><text x="952" y="557" fill="#15352e" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" text-anchor="start">Identity, device,</text><text x="952" y="586" fill="#15352e" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" text-anchor="start">application tools</text><path d="M365 372 H485" fill="none" stroke="#0d7160" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><path d="M795 365 H915" fill="none" stroke="#0d7160" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><path d="M1075 410 V465" fill="none" stroke="#0d7160" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><path d="M920 570 H790 V490 H755" fill="none" stroke="#0d7160" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="495" y="535" width="300" height="45" rx="22" fill="#d8efe3" stroke="#d8efe3" stroke-width="2"/><text x="645" y="565" fill="#0d7160" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="middle">Back-and-forth clarification</text><rect x="70" y="570" width="300" height="45" rx="22" fill="#d8efe3" stroke="#d8efe3" stroke-width="2"/><text x="220" y="600" fill="#0d7160" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="middle">Waiting for status</text><text x="60" y="850" fill="#557068" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="start">Conceptual problem-domain illustration.</text></svg>
