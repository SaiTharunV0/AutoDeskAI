<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="figure-8.1-secure-processing.svg"><rect x="0" y="0" width="1600" height="900" rx="0" fill="#f5faf7" stroke="#f5faf7" stroke-width="2"/><rect x="0" y="0" width="1600" height="15" rx="0" fill="#0d7160" stroke="#0d7160" stroke-width="2"/><text x="60" y="82" fill="#0d7160" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" text-anchor="start">FIGURE 8.1</text><text x="60" y="132" fill="#15352e" font-family="Arial,Helvetica,sans-serif" font-size="39" font-weight="700" text-anchor="start">Secure Request Processing Workflow</text><text x="60" y="170" fill="#557068" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" text-anchor="start">Identity, scope, policy, and external verification are checked in sequence.</text><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#0d7160" stroke-width="2"/></marker></defs><rect x="50" y="335" width="220" height="155" rx="18" fill="white" stroke="#92b7a6" stroke-width="2"/><text x="72" y="373" fill="#15352e" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="start">Sign in</text><text x="72" y="412" fill="#15352e" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" text-anchor="start">JWT account state</text><rect x="330" y="335" width="220" height="155" rx="18" fill="white" stroke="#92b7a6" stroke-width="2"/><text x="352" y="373" fill="#15352e" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="start">Validate</text><text x="352" y="412" fill="#15352e" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" text-anchor="start">Length + rate limit</text><rect x="610" y="335" width="220" height="155" rx="18" fill="white" stroke="#92b7a6" stroke-width="2"/><text x="632" y="373" fill="#15352e" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="start">Sanitize</text><text x="632" y="412" fill="#15352e" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" text-anchor="start">Allowed intent data</text><rect x="890" y="335" width="220" height="155" rx="18" fill="white" stroke="#92b7a6" stroke-width="2"/><text x="912" y="373" fill="#15352e" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="start">Authorize</text><text x="912" y="412" fill="#15352e" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" text-anchor="start">Policy / admin</text><rect x="1170" y="335" width="350" height="155" rx="18" fill="white" stroke="#92b7a6" stroke-width="2"/><text x="1192" y="373" fill="#15352e" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="start">Execute + audit</text><text x="1192" y="412" fill="#15352e" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" text-anchor="start">Verify grant or endpoint result</text><path d="M275 410 H315" fill="none" stroke="#0d7160" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><path d="M555 410 H595" fill="none" stroke="#0d7160" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><path d="M835 410 H875" fill="none" stroke="#0d7160" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><path d="M1115 410 H1155" fill="none" stroke="#0d7160" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="90" y="580" width="315" height="45" rx="22" fill="#d8efe3" stroke="#d8efe3" stroke-width="2"/><text x="247.5" y="610" fill="#0d7160" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="middle">Pending accounts blocked</text><rect x="485" y="580" width="340" height="45" rx="22" fill="#d8efe3" stroke="#d8efe3" stroke-width="2"/><text x="655" y="610" fill="#0d7160" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="middle">Out-of-scope requests rejected</text><rect x="925" y="580" width="490" height="45" rx="22" fill="#d8efe3" stroke="#d8efe3" stroke-width="2"/><text x="1170" y="610" fill="#0d7160" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="middle">No unverified access marked granted</text><text x="60" y="850" fill="#557068" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="start">Conceptual security workflow; see README for implementation details.</text></svg>
