<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="figure-2.1-existing-vs-ai-workflow.svg"><rect x="0" y="0" width="1600" height="900" rx="0" fill="#f5faf7" stroke="#f5faf7" stroke-width="2"/><rect x="0" y="0" width="1600" height="15" rx="0" fill="#0d7160" stroke="#0d7160" stroke-width="2"/><text x="60" y="82" fill="#0d7160" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" text-anchor="start">FIGURE 2.1</text><text x="60" y="132" fill="#15352e" font-family="Arial,Helvetica,sans-serif" font-size="39" font-weight="700" text-anchor="start">Existing vs. AI-Assisted Help Desk Workflow</text><text x="60" y="170" fill="#557068" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" text-anchor="start">The assistant classifies intent; backend rules and administrators retain decision authority.</text><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#0d7160" stroke-width="2"/></marker></defs><rect x="70" y="225" width="680" height="475" rx="18" fill="white" stroke="#92b7a6" stroke-width="2"/><rect x="850" y="225" width="680" height="475" rx="18" fill="white" stroke="#92b7a6" stroke-width="2"/><rect x="105" y="250" width="190" height="45" rx="22" fill="#d8efe3" stroke="#d8efe3" stroke-width="2"/><text x="200" y="280" fill="#0d7160" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="middle">Existing workflow</text><rect x="885" y="250" width="245" height="45" rx="22" fill="#d8efe3" stroke="#d8efe3" stroke-width="2"/><text x="1007.5" y="280" fill="#0d7160" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="middle">AutoDeskAI workflow</text><rect x="105" y="330" width="590" height="62" rx="18" fill="white" stroke="#92b7a6" stroke-width="2"/><text x="127" y="368" fill="#15352e" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="start">Employee reports issue</text><path d="M400 395 V405" fill="none" stroke="#0d7160" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="105" y="410" width="590" height="62" rx="18" fill="white" stroke="#92b7a6" stroke-width="2"/><text x="127" y="448" fill="#15352e" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="start">Support manually triages</text><path d="M400 475 V485" fill="none" stroke="#0d7160" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="105" y="490" width="590" height="62" rx="18" fill="white" stroke="#92b7a6" stroke-width="2"/><text x="127" y="528" fill="#15352e" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="start">Administrator coordinates</text><path d="M400 555 V565" fill="none" stroke="#0d7160" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="105" y="570" width="590" height="62" rx="18" fill="white" stroke="#92b7a6" stroke-width="2"/><text x="127" y="608" fill="#15352e" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="start">Employee follows up</text><rect x="885" y="330" width="590" height="62" rx="18" fill="white" stroke="#92b7a6" stroke-width="2"/><text x="907" y="368" fill="#15352e" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="start">Employee submits request</text><path d="M1180 395 V405" fill="none" stroke="#0d7160" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="885" y="410" width="590" height="62" rx="18" fill="white" stroke="#92b7a6" stroke-width="2"/><text x="907" y="448" fill="#15352e" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="start">Sanitized intent classification</text><path d="M1180 475 V485" fill="none" stroke="#0d7160" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="885" y="490" width="590" height="62" rx="18" fill="white" stroke="#92b7a6" stroke-width="2"/><text x="907" y="528" fill="#15352e" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="start">Policy and admin review</text><path d="M1180 555 V565" fill="none" stroke="#0d7160" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="885" y="570" width="590" height="62" rx="18" fill="white" stroke="#92b7a6" stroke-width="2"/><text x="907" y="608" fill="#15352e" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="start">Provider or endpoint action</text><text x="60" y="850" fill="#557068" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="start">Comparison is conceptual; outcomes depend on configured services.</text></svg>
