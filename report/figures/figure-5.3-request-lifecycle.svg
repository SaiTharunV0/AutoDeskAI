<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="figure-5.3-request-lifecycle.svg"><rect x="0" y="0" width="1600" height="900" rx="0" fill="#f5faf7" stroke="#f5faf7" stroke-width="2"/><rect x="0" y="0" width="1600" height="15" rx="0" fill="#0d7160" stroke="#0d7160" stroke-width="2"/><text x="60" y="82" fill="#0d7160" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" text-anchor="start">FIGURE 5.3</text><text x="60" y="132" fill="#15352e" font-family="Arial,Helvetica,sans-serif" font-size="39" font-weight="700" text-anchor="start">AutoDeskAI Request Lifecycle</text><text x="60" y="170" fill="#557068" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" text-anchor="start">Helpdesk ticket closure and application provisioning are separate states.</text><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#0d7160" stroke-width="2"/></marker></defs><rect x="60" y="330" width="230" height="135" rx="18" fill="white" stroke="#92b7a6" stroke-width="2"/><text x="82" y="368" fill="#15352e" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="start">Created</text><text x="82" y="407" fill="#15352e" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" text-anchor="start">Validated input</text><rect x="355" y="330" width="230" height="135" rx="18" fill="white" stroke="#92b7a6" stroke-width="2"/><text x="377" y="368" fill="#15352e" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="start">Clarification</text><text x="377" y="407" fill="#15352e" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" text-anchor="start">If details missing</text><rect x="650" y="330" width="230" height="135" rx="18" fill="white" stroke="#92b7a6" stroke-width="2"/><text x="672" y="368" fill="#15352e" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="start">Decision</text><text x="672" y="407" fill="#15352e" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" text-anchor="start">Policy or admin</text><rect x="945" y="215" width="260" height="135" rx="18" fill="white" stroke="#92b7a6" stroke-width="2"/><text x="967" y="253" fill="#15352e" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="start">Approved</text><text x="967" y="292" fill="#15352e" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" text-anchor="start">Ticket closes</text><rect x="945" y="475" width="260" height="135" rx="18" fill="white" stroke="#92b7a6" stroke-width="2"/><text x="967" y="513" fill="#15352e" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="start">Rejected</text><text x="967" y="552" fill="#15352e" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" text-anchor="start">Ticket closes</text><rect x="1270" y="215" width="270" height="135" rx="18" fill="white" stroke="#92b7a6" stroke-width="2"/><text x="1292" y="253" fill="#15352e" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="start">Provisioning</text><text x="1292" y="292" fill="#15352e" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" text-anchor="start">External check</text><rect x="1270" y="475" width="270" height="135" rx="18" fill="white" stroke="#92b7a6" stroke-width="2"/><text x="1292" y="513" fill="#15352e" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="start">Outcome</text><text x="1292" y="552" fill="#15352e" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" text-anchor="start">Granted / pending</text><path d="M295 395 H340" fill="none" stroke="#0d7160" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><path d="M590 395 H635" fill="none" stroke="#0d7160" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><path d="M885 370 L930 290" fill="none" stroke="#0d7160" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><path d="M885 420 L930 540" fill="none" stroke="#0d7160" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><path d="M1210 285 H1255" fill="none" stroke="#0d7160" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><path d="M1405 355 V460" fill="none" stroke="#0d7160" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><text x="60" y="850" fill="#557068" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="start">Employee confirmation applies only to open request types that need their outcome.</text></svg>
