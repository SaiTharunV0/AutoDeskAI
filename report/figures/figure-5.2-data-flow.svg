<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="figure-5.2-data-flow.svg"><rect x="0" y="0" width="1600" height="900" rx="0" fill="#f5faf7" stroke="#f5faf7" stroke-width="2"/><rect x="0" y="0" width="1600" height="15" rx="0" fill="#0d7160" stroke="#0d7160" stroke-width="2"/><text x="60" y="82" fill="#0d7160" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" text-anchor="start">FIGURE 5.2</text><text x="60" y="132" fill="#15352e" font-family="Arial,Helvetica,sans-serif" font-size="39" font-weight="700" text-anchor="start">Data Flow Diagram of AutoDeskAI</text><text x="60" y="170" fill="#557068" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" text-anchor="start">Only controlled request fields and sanitized intent are sent onward.</text><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#0d7160" stroke-width="2"/></marker></defs><rect x="65" y="345" width="225" height="145" rx="18" fill="white" stroke="#92b7a6" stroke-width="2"/><text x="87" y="383" fill="#15352e" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="start">Employee</text><text x="87" y="422" fill="#15352e" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" text-anchor="start">Credentials + issue</text><rect x="385" y="345" width="255" height="145" rx="18" fill="white" stroke="#92b7a6" stroke-width="2"/><text x="407" y="383" fill="#15352e" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="start">API process</text><text x="407" y="422" fill="#15352e" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" text-anchor="start">Validate + authorize</text><rect x="740" y="225" width="255" height="145" rx="18" fill="white" stroke="#92b7a6" stroke-width="2"/><text x="762" y="263" fill="#15352e" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="start">Request store</text><text x="762" y="302" fill="#15352e" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" text-anchor="start">PostgreSQL</text><rect x="740" y="470" width="255" height="145" rx="18" fill="white" stroke="#92b7a6" stroke-width="2"/><text x="762" y="508" fill="#15352e" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="start">Classifier</text><text x="762" y="547" fill="#15352e" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" text-anchor="start">Ollama</text><rect x="1100" y="225" width="390" height="145" rx="18" fill="white" stroke="#92b7a6" stroke-width="2"/><text x="1122" y="263" fill="#15352e" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="start">Admin / policy</text><text x="1122" y="302" fill="#15352e" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" text-anchor="start">Decision + audit</text><rect x="1100" y="470" width="390" height="145" rx="18" fill="white" stroke="#92b7a6" stroke-width="2"/><text x="1122" y="508" fill="#15352e" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="start">Service execution</text><text x="1122" y="547" fill="#15352e" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" text-anchor="start">GitHub, Jira, endpoint</text><path d="M295 415 H370" fill="none" stroke="#0d7160" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><path d="M645 395 L725 305" fill="none" stroke="#0d7160" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><path d="M645 440 L725 540" fill="none" stroke="#0d7160" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><path d="M1000 295 H1085" fill="none" stroke="#0d7160" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><path d="M1000 545 H1085" fill="none" stroke="#0d7160" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><path d="M1295 375 V455" fill="none" stroke="#0d7160" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><text x="60" y="850" fill="#557068" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="start">Password entry and raw chat transcripts are not stored by this flow.</text></svg>
