<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="figure-5.1-system-architecture.svg"><rect x="0" y="0" width="1600" height="900" rx="0" fill="#f5faf7" stroke="#f5faf7" stroke-width="2"/><rect x="0" y="0" width="1600" height="15" rx="0" fill="#0d7160" stroke="#0d7160" stroke-width="2"/><text x="60" y="82" fill="#0d7160" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" text-anchor="start">FIGURE 5.1</text><text x="60" y="132" fill="#15352e" font-family="Arial,Helvetica,sans-serif" font-size="39" font-weight="700" text-anchor="start">AutoDeskAI System Architecture</text><text x="60" y="170" fill="#557068" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" text-anchor="start">FastAPI owns policy decisions; external providers report independently verified outcomes.</text><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#0d7160" stroke-width="2"/></marker></defs><rect x="70" y="335" width="265" height="180" rx="18" fill="white" stroke="#92b7a6" stroke-width="2"/><text x="92" y="373" fill="#15352e" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="start">React frontend</text><text x="92" y="412" fill="#15352e" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" text-anchor="start">Employee portal</text><text x="92" y="441" fill="#15352e" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" text-anchor="start">Admin portal</text><rect x="415" y="335" width="265" height="180" rx="18" fill="white" stroke="#92b7a6" stroke-width="2"/><text x="437" y="373" fill="#15352e" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="start">FastAPI backend</text><text x="437" y="412" fill="#15352e" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" text-anchor="start">Auth, workflow,</text><text x="437" y="441" fill="#15352e" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" text-anchor="start">policy, audit</text><rect x="750" y="225" width="265" height="140" rx="18" fill="white" stroke="#92b7a6" stroke-width="2"/><text x="772" y="263" fill="#15352e" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="start">PostgreSQL</text><text x="772" y="302" fill="#15352e" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" text-anchor="start">Users, requests, audit</text><rect x="750" y="450" width="265" height="140" rx="18" fill="white" stroke="#92b7a6" stroke-width="2"/><text x="772" y="488" fill="#15352e" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="start">Ollama</text><text x="772" y="527" fill="#15352e" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" text-anchor="start">Sanitized intent only</text><rect x="1090" y="195" width="390" height="125" rx="18" fill="white" stroke="#92b7a6" stroke-width="2"/><text x="1112" y="233" fill="#15352e" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="start">Access providers</text><text x="1112" y="272" fill="#15352e" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" text-anchor="start">GitHub organization / Jira group</text><rect x="1090" y="385" width="390" height="125" rx="18" fill="white" stroke="#92b7a6" stroke-width="2"/><text x="1112" y="423" fill="#15352e" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="start">Windows endpoint agent</text><text x="1112" y="462" fill="#15352e" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" text-anchor="start">WinGet install + verification</text><rect x="1090" y="575" width="390" height="125" rx="18" fill="white" stroke="#92b7a6" stroke-width="2"/><text x="1112" y="613" fill="#1